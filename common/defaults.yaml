common:
  enabled: true
  common:
    - wireguard-tools
    - iotop
    - bonnie++
    - git
    - subversion
    - age
    - jq
    - unzip
    - containernetworking-plugins
  debian:
    - python3-dev
    - python3-cryptography
    - build-essential
    - anacron
    - openssh-server
    - apt-file
    - at
  redhat:
    - python3-devel
    - python3-cryptography
    - cronie-anacron
  virtio:
    enabled: true
    modules:
      - virtio
      - virtio_pci
      - virtio_blk
      - virtio_net
      - virtio_scsi
      - virtio_balloon
      - virtio_console
      - virtio_rng
  pip:
    - httpie
    - pre-commit
    - salt-lint
    - yamllint
