# -*- coding: utf-8 -*-
# vim: ft=yaml
---
docker:
  process_signature: '/usr/bin/docker'
  install_docker_py: true
  python_package: docker
  refresh_repo: true
  configfile: /etc/default/docker
  config: []
  daemon_config: {}
  rootuser: root
  data_dir: /var/lib/docker

  use_upstream_repo: true
  proxy: false

  # Register the `nvidia` runtime in daemon.json so `docker run --runtime nvidia`
  # / `--gpus` can reach the GPU. Requires the nvidia/container-toolkit formula.
  # Declarative here (rather than via `nvidia-ctk runtime configure`) so the
  # docker formula stays the single manager of daemon.json.
  # NOTE: "userns-remap": "default" (below, in files/daemon.json) can conflict
  # with GPU device injection in some docker+nvidia setups. If GPU containers
  # fail under userns-remap, disabling it may be required (host-specific).
  nvidia_runtime: false

  pkgs:
    - iptables
    - ca-certificates
    - gnupg

  daemon:
    enabled: true
    # renovate: datasource=deb depName=docker-ce registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 29.8.1

  cli:
    enabled: true
    # renovate: datasource=deb depName=docker-ce-cli registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 29.8.1

  buildx_plugin:
    enabled: true
    # renovate: datasource=deb depName=docker-buildx-plugin registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 0.39.0

  compose_plugin:
    enabled: true
    # renovate: datasource=deb depName=docker-compose-plugin registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 5.6.1
  model_plugin:
    enabled: false
    # renovate: datasource=deb depName=docker-model-plugin registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 1.2.9
  sbx:
    enabled: false
    # No Renovate annotation: no upstream GitHub repo with stable release tags
    # matching the docker-sbx apt version (docker/sbx-releases only lists pre-releases/nightlies).
    version: 0.51.0
  secrets_engine:
    enabled: false
    # renovate: datasource=deb depName=docker-secrets-engine registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 0.11.2
  secrets_engine_plugins:
    enabled: false
    # Must match secrets_engine.version (apt pins an exact docker-secrets-engine dependency).
    # renovate: datasource=deb depName=docker-secrets-engine-plugins registryUrl=https://download.docker.com/linux/ubuntu?suite=noble&components=stable&binaryArch=amd64 versioning=deb extractVersion=^(?:\d+:)?(?<version>\d+(?:\.\d+)+)(?:-\d+)?~.*$
    version: 0.11.2
  cagent:
    enabled: false
    # No Renovate annotation: docker/cagent latest release (v1.161.x) is far ahead
    # of the version published in the Docker apt repo (1.23.3), so bumps would not install.
    version: 1.23.3
  scout_plugin:
    enabled: true
    # renovate: datasource=github-releases depName=docker/scout-cli
    version: v1.29.0
    base_url: https://github.com/docker/scout-cli/releases/download
    install_dir: /usr/local/docker-scout
    plugin_dir: /usr/local/lib/docker/cli-plugins
