# -*- coding: utf-8 -*-
# vim: ft=yaml
---
docker:
  process_signature: '/usr/bin/docker'
  install_docker_py: true
  python_package: docker
  refresh_repo: true
  configfile: /etc/default/docker
  config: []
  daemon_config: {}
  rootuser: root
  data_dir: /var/lib/docker

  use_upstream_repo: true
  proxy: false

  # Register the `nvidia` runtime in daemon.json so `docker run --runtime nvidia`
  # / `--gpus` can reach the GPU. Requires the nvidia/container-toolkit formula.
  # Declarative here (rather than via `nvidia-ctk runtime configure`) so the
  # docker formula stays the single manager of daemon.json.
  # NOTE: "userns-remap": "default" (below, in files/daemon.json) can conflict
  # with GPU device injection in some docker+nvidia setups. If GPU containers
  # fail under userns-remap, disabling it may be required (host-specific).
  nvidia_runtime: false

  pkgs:
    - iptables
    - ca-certificates
    - gnupg

  daemon:
    enabled: true
    # renovate: datasource=github-releases depName=moby/moby
    version: 29.8.1

  cli:
    enabled: true
    # renovate: datasource=github-releases depName=docker/cli
    version: 29.8.1

  containerd:
    enabled: true
    # renovate: datasource=github-releases depName=containerd/containerd
    version: 2.3.6

  buildx_plugin:
    enabled: true
    # renovate: datasource=github-releases depName=docker/buildx
    version: 0.37.1

  compose_plugin:
    enabled: true
    # renovate: datasource=github-releases depName=docker/compose
    version: 5.5.1
