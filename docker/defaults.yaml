# -*- coding: utf-8 -*-
# vim: ft=yaml
---
docker:
  process_signature: '/usr/bin/docker'
  install_docker_py: true
  python_package: docker
  refresh_repo: true
  configfile: /etc/default/docker
  config: []
  daemon_config: {}
  rootuser: root
  data_dir: /var/lib/docker

  use_upstream_repo: true
  proxy: false

  pkgs:
    - iptables
    - ca-certificates
    - gnupg

  daemon:
    enabled: true
    # renovate: datasource=github-releases depName=moby/moby
    version: 28.3.1
  
  cli:
    enabled: true
    # renovate: datasource=github-releases depName=docker/cli
    version: 28.3.1
  
  containerd:
    enabled: true
    # renovate: datasource=github-releases depName=containerd/containerd
    version: 1.7.27
  
  buildx_plugin:
    enabled: true
    # renovate: datasource=github-releases depName=docker/buildx
    version: 0.25.0
  
  compose_plugin:
    enabled: true
    # renovate: datasource=github-releases depName=docker/compose
    version: 2.38.1
