AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM Roles Anywhere configuration — trust anchor, profile, and IAM role.
  Deploy this stack after generating the CA certificate with the
  aws.iamrolesanywhere.ca Salt formula. Provide the CA certificate PEM
  as the CACertificatePEM parameter.

Parameters:
  TrustAnchorName:
    Type: String
    Description: Name for the IAM Roles Anywhere trust anchor (also used in the stack name).

  ProfileName:
    Type: String
    Default: default
    Description: Name for the IAM Roles Anywhere profile.

  RoleName:
    Type: String
    Default: RolesAnywhereWorkstationRole
    Description: Name for the IAM role assumed via Roles Anywhere.

  CACertificatePEM:
    Type: String
    Description: >
      PEM-encoded CA certificate (content of ca.pem generated by the
      aws.iamrolesanywhere.ca formula). Paste the full PEM including
      -----BEGIN CERTIFICATE----- and -----END CERTIFICATE-----.
    NoEcho: true

  SessionDuration:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 43200
    Description: Session duration in seconds (15 min to 12 hours).

  ManagedPolicyArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Comma-separated list of managed policy ARNs to attach to the role.
      Leave empty if you define permissions inline via RolePolicy.

  ConditionSubjectCN:
    Type: String
    Default: ""
    Description: >
      Optional: restrict role assumption to certificates with this Common Name.
      Leave empty to allow any certificate signed by the CA.

Conditions:
  HasManagedPolicies: !Not [!Equals [!Select [0, !Ref ManagedPolicyArns], ""]]
  HasSubjectCondition: !Not [!Equals [!Ref ConditionSubjectCN, ""]]

Resources:

  # IAM Role trusted by IAM Roles Anywhere
  RolesAnywhereRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
              - sts:TagSession
            Condition: !If
              - HasSubjectCondition
              - StringEquals:
                  aws:PrincipalTag/x509Subject/CN: !Ref ConditionSubjectCN
              - !Ref AWS::NoValue
      ManagedPolicyArns: !If
        - HasManagedPolicies
        - !Ref ManagedPolicyArns
        - !Ref AWS::NoValue
      Tags:
        - Key: ManagedBy
          Value: salt-ubuntu-devops-tools

  # Trust Anchor — references the self-signed CA certificate
  TrustAnchor:
    Type: AWS::RolesAnywhere::TrustAnchor
    Properties:
      Name: !Ref TrustAnchorName
      Enabled: true
      Source:
        SourceType: CERTIFICATE_BUNDLE
        SourceData:
          X509CertificateData: !Ref CACertificatePEM
      Tags:
        - Key: ManagedBy
          Value: salt-ubuntu-devops-tools

  # Profile — links the trust anchor to the role
  RolesAnywhereProfile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Ref ProfileName
      Enabled: true
      RoleArns:
        - !GetAtt RolesAnywhereRole.Arn
      DurationSeconds: !Ref SessionDuration
      Tags:
        - Key: ManagedBy
          Value: salt-ubuntu-devops-tools

Outputs:
  TrustAnchorArn:
    Description: Trust anchor ARN (use in pillar iam_roles_anywhere.trust_anchor_arn)
    Value: !GetAtt TrustAnchor.TrustAnchorArn

  ProfileArn:
    Description: Profile ARN (use in pillar iam_roles_anywhere.profile_arn)
    Value: !GetAtt RolesAnywhereProfile.ProfileArn

  RoleArn:
    Description: Role ARN (use in pillar iam_roles_anywhere.role_arn)
    Value: !GetAtt RolesAnywhereRole.Arn

  PillarSnippet:
    Description: Copy this into your Salt pillar to configure the agentgateway formula
    Value: !Sub |
      iam_roles_anywhere:
        enabled: true
        trust_anchor_arn: "${TrustAnchor.TrustAnchorArn}"
        profile_arn: "${RolesAnywhereProfile.ProfileArn}"
        role_arn: "${RolesAnywhereRole.Arn}"
        region: "${AWS::Region}"
